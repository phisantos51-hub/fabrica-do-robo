<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fábrica do Robô</title>
  <meta name="description" content="Jogo de raciocínio lógico para o 1º, 2º e 3º ano: monte robôs, resolva a Torre e descubra padrões.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <!-- O "?v=" obriga o navegador a baixar a versão nova. Ao mudar arquivos, aumente o número. -->
  <link rel="stylesheet" href="css/estilo.css?v=1">
</head>
<body>
  <header class="barra" data-grupo="barra">
    <button type="button" id="btn-inicio" class="botao-barra" hidden>
      <svg class="icone" viewBox="0 0 48 48" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24L24 8l18 16M11 20v20h26V20"/><path d="M20 40V29h8v11"/></svg>
      <span>Início</span>
    </button>
    <p class="marca-jogo" aria-hidden="true">
      <svg class="engrenagem" viewBox="0 0 48 48" focusable="false"><path d="M24 4l3 6 6-2 1 7 7 1-2 6 6 3-6 3 2 6-7 1-1 7-6-2-3 6-3-6-6 2-1-7-7-1 2-6-6-3 6-3-2-6 7-1 1-7 6 2z"/><circle cx="24" cy="24" r="7" fill="#fff"/></svg>
      <span>Fábrica do Robô</span>
    </p>
    <div id="progresso" class="progresso" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" hidden>
      <div class="barra-fundo"><div class="barra-cheia"></div></div>
      <span class="progresso-texto"></span>
    </div>
    <div class="botoes-barra">
      <button type="button" id="btn-como" class="botao-barra">
        <svg class="icone" viewBox="0 0 48 48" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><circle cx="24" cy="24" r="19"/><path d="M18 19a6 6 0 1 1 8 5.6c-1.3.5-2 1.6-2 3V30"/><circle cx="24" cy="36" r="1.5" fill="currentColor"/></svg>
        <span>Como jogar</span>
      </button>
      <button type="button" id="btn-som" class="botao-barra" aria-pressed="false"><span>Som desligado</span></button>
      <button type="button" id="btn-pausa" class="botao-barra botao-pausa">
        <svg class="icone" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><rect x="13" y="10" width="7" height="28" rx="2" fill="currentColor"/><rect x="28" y="10" width="7" height="28" rx="2" fill="currentColor"/></svg>
        <span>Pausa</span>
      </button>
    </div>
  </header>

  <main id="tela" data-grupo="tela" tabindex="-1">
    <h1>Fábrica do Robô</h1>
    <noscript><p>Para jogar, o JavaScript do navegador precisa estar ligado.</p></noscript>
  </main>

  <!-- Região lida pelo NVDA e pelo Narrador quando o jogo dá um aviso. -->
  <div id="anuncio" class="so-leitor" aria-live="polite" aria-atomic="true"></div>

  <footer class="rodape">
    <button type="button" id="btn-professor" class="botao-discreto">Área do professor</button>
  </footer>

  <!-- Janelas -->
  <dialog id="dlg-como" class="janela" aria-labelledby="dlg-como-titulo">
    <div class="janela-corpo"></div>
    <div class="janela-rodape" data-grupo="como-rodape">
      <button type="button" class="botao principal fechar">Fechar</button>
    </div>
  </dialog>

  <dialog id="dlg-pausa" class="janela janela-pausa" aria-labelledby="pausa-titulo">
    <div class="pausa-conteudo" data-grupo="pausa">
      <div class="respira" aria-hidden="true"></div>
      <h2 id="pausa-titulo">Pausa</h2>
      <p>O jogo está parado. Você pode descansar.</p>
      <p>Quando quiser voltar, aperte o botão.</p>
      <button type="button" class="botao principal voltar-jogo">Voltar ao jogo</button>
    </div>
  </dialog>

  <dialog id="dlg-ajustes" class="janela" aria-label="Ajustes">
    <div class="janela-corpo"></div>
    <div class="janela-rodape" data-grupo="ajustes-rodape">
      <button type="button" class="botao principal fechar">Fechar</button>
    </div>
  </dialog>

  <dialog id="dlg-professor" class="janela" aria-label="Área do professor">
    <div class="janela-corpo"></div>
    <div class="janela-rodape" data-grupo="professor-rodape">
      <button type="button" class="botao fechar">Fechar</button>
    </div>
  </dialog>

  <dialog id="dlg-fim" class="janela janela-fim" aria-label="Desafio terminado">
    <div class="janela-corpo"></div>
  </dialog>

  <script src="js/desafios.js?v=1"></script>
  <script src="js/sons.js?v=1"></script>
  <script src="js/robo.js?v=1"></script>
  <script src="js/nucleo.js?v=1"></script>
  <script src="js/sala-montagem.js?v=1"></script>
  <script src="js/sala-torre.js?v=1"></script>
</body>
</html>
